<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tarjeta de Golf</title>
<meta name="theme-color" content="#1E5A3C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Golf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one-column phone app with a bottom tab bar; the scorecard grid is the signature element. */
:root{
  --bg:#F3F6F1; --surface:#FFFFFF; --sunk:#E6ECE3; --line:#D3DCCF;
  --ink:#14231B; --muted:#5B6B61; --green:#1E5A3C; --green-2:#2F7A52; --on-green:#F3F8F2;
  --flag:#D9A21B; --birdie:#C2412D; --bogey:#2D5B8F; --good:#2F7A52; --warn:#B7791F; --bad:#B23B2A;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1813; --surface:#16231C; --sunk:#1D2D24; --line:#2A3D32;
  --ink:#E7EFE8; --muted:#97A99D; --green:#3E9A69; --green-2:#55B07F; --on-green:#0C1610;
  --flag:#E8B53A; --birdie:#EE7A63; --bogey:#7EA9DB; --good:#5CC08A; --warn:#E3A84A; --bad:#EE7A63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1813; --surface:#16231C; --sunk:#1D2D24; --line:#2A3D32;
  --ink:#E7EFE8; --muted:#97A99D; --green:#3E9A69; --green-2:#55B07F; --on-green:#0C1610;
  --flag:#E8B53A; --birdie:#EE7A63; --bogey:#7EA9DB; --good:#5CC08A; --warn:#E3A84A; --bad:#EE7A63; color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:8px 4px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:600;min-width:0}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2.wrap{grid-template-columns:1fr}}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--green)}
nav.tabs svg{width:22px;height:22px}

/* Handicap hero */
.hcp{background:var(--green);color:var(--on-green);border:0;display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:center}
.hcp .big{font-family:var(--display);font-weight:800;font-size:56px;line-height:.9;letter-spacing:-.03em;grid-row:span 2}
.hcp .eyebrow{color:color-mix(in srgb,var(--on-green) 75%,transparent)}
.hcp small{opacity:.85}

/* Score shapes: scorecard convention, circles under par, squares over */
.sc{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;font-family:var(--mono);font-weight:700;font-size:14px;position:relative}
.sc.b1{border:1.5px solid var(--birdie);border-radius:50%;color:var(--birdie)}
.sc.b2{border:1.5px solid var(--birdie);border-radius:50%;color:var(--birdie);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--birdie)}
.sc.o1{border:1.5px solid var(--bogey);color:var(--bogey)}
.sc.o2{border:1.5px solid var(--bogey);color:var(--bogey);box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--bogey)}
.sc.o3{background:var(--bogey);color:var(--surface)}
.sc.empty{color:var(--line)}

/* Scorecard table */
.tablewrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table.card9{border-collapse:collapse;width:100%;min-width:420px;font-size:13px}
table.card9 th,table.card9 td{text-align:center;padding:5px 2px;border-bottom:1px solid var(--line)}
table.card9 th{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
table.card9 td:first-child,table.card9 th:first-child{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding-right:8px;white-space:nowrap}
table.card9 .tot{font-weight:700;background:var(--sunk)}

/* Live scoring */
.holebar{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px;padding:4px 0 8px}
.holebar button{min-width:0;min-height:50px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 0;display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted)}
.holebar button[aria-current="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.holebar .sc{width:24px;height:24px;font-size:12px}
.holehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.holeno{font-family:var(--display);font-weight:800;font-size:76px;line-height:.82;letter-spacing:-.04em}
.holemeta{display:flex;gap:16px;text-align:right}
.holemeta div b{display:block;font-family:var(--mono);font-size:22px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted)}
.chip.flag{background:color-mix(in srgb,var(--flag) 22%,var(--surface));color:var(--ink)}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:8px}
.stepper button{height:64px;border-radius:16px;border:1px solid var(--line);background:var(--sunk);font-size:30px;font-weight:600;line-height:1}
.stepper .val{text-align:center}
.stepper .val b{font-family:var(--mono);font-size:48px;line-height:1;display:block}
.stepper.small{grid-template-columns:52px 1fr 52px}
.stepper.small button{height:52px;font-size:24px}
.stepper.small .val b{font-size:30px}
.fw{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:6px}
.fw button{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;font-weight:600}
.fw button[aria-pressed="true"]{background:var(--green);color:var(--on-green);border-color:var(--green)}
.fw button.miss[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.toggle{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;font-weight:600;padding:0 14px}
.toggle[aria-pressed="true"]{background:var(--flag);border-color:var(--flag);color:#1a1405}
.navbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.total{display:flex;gap:14px;align-items:baseline}
.total b{font-family:var(--mono);font-size:20px}

/* Stats */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:520px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.tile b{display:block;font-family:var(--mono);font-size:24px;margin-top:2px}
.tile .ref{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.ok{background:var(--good)}.mid{background:var(--warn)}.ko{background:var(--bad)}
.insight{display:grid;grid-template-columns:4px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.insight:last-child{border-bottom:0}
.insight i{border-radius:4px}
.insight p{margin:2px 0 0;color:var(--muted);font-size:14px}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:86px 1fr 46px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.holegrid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.holegrid div{border-radius:8px;padding:6px 0;text-align:center;font-size:11px;background:var(--sunk)}
.holegrid div b{display:block;font-family:var(--mono);font-size:13px}
svg text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.list button.item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:12px 0;border-bottom:1px solid var(--line)}
.list button.item:last-child{border-bottom:0}
.diffpill{font-family:var(--mono);font-size:13px;padding:3px 8px;border-radius:8px;background:var(--sunk)}
.diffpill.best{background:color-mix(in srgb,var(--good) 22%,var(--surface));color:var(--ink)}
.banner{background:color-mix(in srgb,var(--flag) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--flag) 45%,var(--line));border-radius:12px;padding:12px 14px;font-size:14px}
.ai{white-space:pre-wrap;font-size:14.5px}
.plan .plan-shot{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border-radius:12px;padding:12px}
.holecard.solo{grid-template-columns:1fr}
.holephoto{position:relative;border:0;padding:0;background:var(--sunk);border-radius:14px;overflow:hidden;display:block;width:100%;align-self:start}
.holephoto svg{display:block;width:100%;height:auto}
.holesvg.book text{opacity:1}
.sheet .holesvg.book{max-height:none;width:100%;max-width:440px;margin:0 auto}
.holesvg.book text.dl{font-family:var(--mono);font-weight:700;fill:#fff;paint-order:stroke;stroke:rgb(0 0 0 / .55);stroke-width:2.2px}
.holesvg.book text.gl{font-style:italic;fill:#FFF3C4}
.holesvg.book text.hd{font-family:var(--body);fill:var(--ink);stroke:none;font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:9px;border-radius:5px;margin-right:5px;vertical-align:middle}
.dtable{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px}
.dtable b{font-family:var(--mono);text-align:right}
.holephoto span{position:absolute;right:8px;bottom:8px;background:rgb(0 0 0 / .55);color:#fff;font-size:12px;font-weight:600;border-radius:8px;padding:3px 8px}
.plist{display:flex;flex-direction:column;gap:4px;font-size:13px}
.plist div{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:baseline}
.plist div.hz span{color:var(--warn);font-weight:600}
.markchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.markchips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:12.5px;text-align:left}
.markchips button b{font-size:13px}
.markchips button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.club2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:13.5px;background:var(--sunk);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.sheet.book{max-height:92vh;overflow-y:auto}

.prog{display:grid;grid-template-columns:1fr 84px auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prog:last-child{border-bottom:0}
.prog .lbl{min-width:0}
.prog .lbl small{display:block;color:var(--muted);font-family:var(--mono);font-size:12px}
.state{font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.state.up{background:color-mix(in srgb,var(--good) 20%,var(--surface));color:var(--good)}
.state.down{background:color-mix(in srgb,var(--bad) 18%,var(--surface));color:var(--bad)}
.state.same{background:var(--sunk);color:var(--muted)}
.vspar{font-family:var(--mono);font-weight:700;font-size:20px}
:root{--tree:color-mix(in srgb,var(--green) 70%,#0b2a1a);--water:#4F8FC7;--sand2:color-mix(in srgb,var(--flag) 52%,#fff);--path:#CDB892;--rough:color-mix(in srgb,var(--green) 22%,var(--surface));--fair:color-mix(in srgb,var(--green-2) 48%,var(--surface));--putt:color-mix(in srgb,var(--green-2) 78%,var(--surface));--sandc:color-mix(in srgb,var(--flag) 40%,var(--surface))}
/* Hole card: drawing + vertical stroke counter */
.holecard{display:grid;grid-template-columns:minmax(0,1fr) 128px;gap:14px;align-items:stretch}
.holesvg{width:100%;height:auto;max-height:300px;display:block;touch-action:manipulation}
.holesvg [data-a]{cursor:pointer}
.holesvg .zone circle.hit{fill:transparent;stroke:transparent}
.holesvg .zone:focus{outline:none}.holesvg .zone:focus-visible circle.hit{stroke:var(--flag);stroke-width:2}
.holesvg text{font-family:var(--body);font-size:10px;font-weight:700;fill:var(--ink);opacity:.75}
.vstep{display:flex;flex-direction:column;gap:6px;align-items:stretch;justify-content:center}
.vstep button{height:58px;border-radius:16px;border:1px solid var(--line);background:var(--sunk);font-size:28px;font-weight:600}
.vstep .val{text-align:center;padding:4px 0}
.vstep .val b{font-family:var(--mono);font-size:56px;line-height:1;display:inline-flex;align-items:center;justify-content:center;width:84px;height:84px}
.vstep .val b.b1,.vstep .val b.b2{border-radius:50%}
.vstep .val b.b1{border:3px solid var(--birdie);color:var(--birdie)}
.vstep .val b.b2{border:3px double var(--birdie);border-width:6px;color:var(--birdie)}
.vstep .val b.o1{border:3px solid var(--bogey);color:var(--bogey)}
.vstep .val b.o2{border:6px double var(--bogey);color:var(--bogey)}
.vstep .val b.o3{background:var(--bogey);color:var(--surface);border-radius:4px}
.vstep .val small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 0 6px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);min-height:48px}
.quick button .sc{width:22px;height:22px;font-size:11px}
.quick button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.putts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.putts button{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:46px;font-family:var(--mono);font-weight:700;font-size:18px}
.putts button[aria-pressed="true"]{background:var(--putt);border-color:var(--green-2);color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.slide-l{animation:sl .22s ease-out}.slide-r{animation:sr .22s ease-out}@keyframes sl{from{transform:translateX(36px);opacity:.3}}@keyframes sr{from{transform:translateX(-36px);opacity:.3}}}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
.celebrate{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:min(58px,12vw);letter-spacing:-.03em;color:var(--birdie);z-index:71;pointer-events:none;white-space:nowrap;text-shadow:0 3px 0 var(--surface),0 0 24px var(--surface);animation:pop 1.5s ease-out forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-50%) scale(1.12);opacity:1}70%{opacity:1}100%{transform:translate(-50%,-75%) scale(1);opacity:0}}
/* Stacked result bar */
.dbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--sunk)}
.dbar span{height:100%}
.dlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.dlegend b{color:var(--ink);font-family:var(--mono)}
/* Round summary */
.summary{background:var(--green);color:var(--on-green);border:0}
.summary .eyebrow,.summary .muted{color:color-mix(in srgb,var(--on-green) 75%,transparent)}
.summary .res{font-family:var(--display);font-weight:800;font-size:84px;line-height:.9;letter-spacing:-.04em}
.summary .dbar{background:color-mix(in srgb,var(--on-green) 15%,transparent)}
.summary .dlegend,.summary .dlegend b{color:var(--on-green)}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--flag);color:#1a1405;border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}
.hl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hl div{background:color-mix(in srgb,var(--on-green) 12%,transparent);border-radius:12px;padding:10px}
.hl b{display:block;font-family:var(--mono);font-size:20px}
.hl span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
/* Form strip + interactive charts */
.formbars svg rect[data-a]{cursor:pointer}
.tile[data-a]{cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.tile[aria-pressed="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.chartsel{font-size:13px;background:var(--sunk);border-radius:10px;padding:8px 12px}
svg circle[data-a]{cursor:pointer}
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.coursegrid{display:grid;grid-template-columns:34px 1fr 1fr;gap:6px 8px;align-items:center}
.coursegrid input,.coursegrid select{min-height:38px;padding:6px 8px}
.teerow{display:grid;grid-template-columns:1.4fr 1fr 1fr 40px;gap:6px;align-items:center}
.teerow input{min-height:40px;padding:6px 8px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px}

<div id="app"><p class="muted" style="padding-top:40px">Cargando tus vueltas…</p></div>

    <div id="m-info" class="mdist"></div>

<script>
"use strict";
/* ---------- Built-in course (editable; values to verify against the club's card) ---------- */
const BUILTIN = {
  vallromanes: {
    id: "vallromanes", name: "Club de Golf Vallromanes", builtin: true,
    tees: [
      { name: "Blancas", cr: 72.1, slope: 137 },
      { name: "Amarillas", cr: 71.2, slope: 135 },
      { name: "Azules", cr: 73.0, slope: 131 },
      { name: "Rojas", cr: 71.9, slope: 129 }
    ],
    holes: [
      [4,12],[3,16],[4,2],[5,8],[4,10],[4,14],[3,18],[4,4],[5,6],
      [4,1],[5,11],[3,15],[4,9],[4,13],[4,5],[5,3],[3,17],[4,7]
    ].map(([par, si], i) => ({ n: i + 1, par, si }))
  }
};

/* ---------- State ---------- */
const S = {
  ready: false, tab: "play", courses: {}, rounds: {}, active: null,
  profile: { officialHI: null }, filterN: 10, statCourse: null,
  viewRound: null, editCourse: null, sheet: null, ai: null, aiBusy: false, toast: null,
  form: { courseId: "vallromanes", tee: "Amarillas", date: today(), start: 1, count: 18 }
};
function today(){ const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const r1 = x => Math.round(x * 10) / 10;
const fmt1 = x => x == null || isNaN(x) ? "–" : (Math.round(x*10)/10).toFixed(1).replace(".", ",");
const fmtHI = x => x == null ? "–" : (x < 0 ? "+" + fmt1(-x) : fmt1(x));
const pct = x => x == null || isNaN(x) ? "–" : Math.round(x * 100) + "%";
const toParStr = x => x === 0 ? "E" : (x > 0 ? "+" + x : String(x));
const fmtDate = s => { const [y,m,d] = s.split("-"); return `${+d} ${["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"][m-1]} ${y}`; };

/* ---------- Storage: this phone's browser (export a backup from Campos) ---------- */
const KEY = "golf-tarjeta";
const Store = {
  mode: "local",
  async init(){
    try {
      const raw = JSON.parse(localStorage.getItem(KEY) || "{}");
      Object.assign(S.profile, raw.profile || {});
      S.courses = raw.courses || {}; S.rounds = raw.rounds || {};
      const act = localStorage.getItem(KEY + "-active");
      S.active = act ? JSON.parse(act) : raw.active || null;
    } catch {}
    if (!S.profile.shots) S.profile.shots = {};
    try { navigator.storage?.persist?.(); } catch {}
  },
  saveLocal(part){
    try {
      if (part !== "main") S.active ? localStorage.setItem(KEY + "-active", JSON.stringify(S.active)) : localStorage.removeItem(KEY + "-active");
      if (part !== "active") localStorage.setItem(KEY, JSON.stringify({ profile: S.profile, courses: S.courses, rounds: S.rounds }));
    } catch { showToast("No se pudo guardar: el almacenamiento del navegador está lleno o bloqueado."); }
  },
  profile(){ this.saveLocal("main"); }, course(){ this.saveLocal("main"); }, round(){ this.saveLocal("main"); }, active(){ this.saveLocal("active"); }
};

/* ---------- Golf maths (World Handicap System) ---------- */
const courses = () => ({ ...BUILTIN, ...S.courses });
function holeOrder(start, count){
  const out = [];
  for (let i = 0; i < count; i++) out.push(((start - 1 + i) % 18) + 1);
  return out;
}
function courseHandicap(hi, cr, slope, par, count){
  if (hi == null) return null;
  return count === 18 ? Math.round(hi * slope / 113 + (cr - par))
                      : Math.round((hi / 2) * slope / 113 + (cr / 2 - par));
}
/* strokes received per hole, allotted by stroke index among the holes played */
function strokesReceived(holes, ch){
  const map = {};
  holes.forEach(h => map[h.n] = 0);
  if (ch == null) return map;
  const n = holes.length, ranked = [...holes].sort((a, b) => a.si - b.si);
  const sign = ch < 0 ? -1 : 1, abs = Math.abs(ch);
  ranked.forEach((h, i) => {
    const extra = sign > 0 ? (i < abs % n ? 1 : 0) : (i >= n - (abs % n) ? 1 : 0);
    map[h.n] = sign * (Math.floor(abs / n) + extra);
  });
  return map;
}
function adjustedGross(r){
  const rec = strokesReceived(r.holes, r.ch);
  return r.holes.reduce((s, h) => {
    if (!h.done) return s + h.par + Math.max(0, rec[h.n]);              // hole not played: net par
    const cap = r.hiAtStart == null ? h.par + 5 : h.par + 2 + rec[h.n];   // net double bogey
    return s + Math.min(h.strokes, cap);
  }, 0);
}
function differential(r){
  if (!r.holes.every(h => h.done)) return null;
  const ags = adjustedGross(r);
  if (r.count === 18) return r1((113 / r.slope) * (ags - r.cr));
  const d9 = (113 / r.slope) * (ags - r.cr / 2);
  const expected = r.hiAtStart == null ? d9 : (r.hiAtStart * 0.52 + 1.197);
  return r1(d9 + expected);
}
const WHS_TABLE = { 3:[1,-2], 4:[1,-1], 5:[1,0], 6:[2,-1], 7:[2,0], 8:[2,0], 9:[3,0], 10:[3,0], 11:[3,0], 12:[4,0], 13:[4,0], 14:[4,0], 15:[5,0], 16:[5,0], 17:[6,0], 18:[6,0], 19:[7,0], 20:[8,0] };
function indexFrom(diffs){
  const last = diffs.slice(-20);
  if (last.length < 3) return null;
  const [take, adj] = WHS_TABLE[last.length];
  const best = [...last].sort((a, b) => a - b).slice(0, take);
  return Math.min(54, r1(best.reduce((s, x) => s + x, 0) / take + adj));
}
const finished = () => Object.values(S.rounds).filter(r => r.finished).sort((a, b) => (a.date + a.id).localeCompare(b.date + b.id));
const counted = () => finished().filter(r => r.diff != null);
function hiHistory(){
  const rs = counted(), out = [];
  rs.forEach((r, i) => out.push({ r, diff: r.diff, hi: indexFrom(rs.slice(0, i + 1).map(x => x.diff)) }));
  return out;
}
function appHI(){ return indexFrom(counted().map(r => r.diff)); }
function playHI(){ return appHI() ?? (S.profile.officialHI ?? null); }
function rec20(){ return new Set([...counted().slice(-20)].sort((a, b) => a.diff - b.diff).slice(0, WHS_TABLE[Math.min(20, Math.max(3, counted().length))]?.[0] || 0).map(r => r.id)); }

/* ---------- Round helpers ---------- */
function relName(d){ return d <= -3 ? "Albatros" : d === -2 ? "Eagle" : d === -1 ? "Birdie" : d === 0 ? "Par" : d === 1 ? "Bogey" : d === 2 ? "Doble bogey" : d === 3 ? "Triple bogey" : `+${d}`; }
function scoreCls(strokes, par){
  if (strokes == null) return "empty";
  const d = strokes - par;
  return d <= -2 ? "b2" : d === -1 ? "b1" : d === 0 ? "" : d === 1 ? "o1" : d === 2 ? "o2" : "o3";
}
const scoreBadge = (h, dim) => `<span class="sc ${h.done || dim ? scoreCls(h.strokes, h.par) : "empty"}">${h.done || dim ? h.strokes : "·"}</span>`;
function roundTotals(r){
  const done = r.holes.filter(h => h.done);
  const gross = done.reduce((s, h) => s + h.strokes, 0), par = done.reduce((s, h) => s + h.par, 0);
  const putts = done.reduce((s, h) => s + (h.putts ?? 0), 0);
  return { done: done.length, gross, par, toPar: gross - par, putts, net: r.ch == null ? null : gross - (r.holes.every(h => h.done) ? r.ch : 0) };
}
function newRound(){
  const f = S.form, c = courses()[f.courseId], tee = c.tees.find(t => t.name === f.tee) || c.tees[0];
  const order = holeOrder(f.start, f.count);
  const holes = order.map(n => { const h = c.holes[n - 1]; return { n, par: h.par, si: h.si, strokes: h.par, putts: 2, fw: null, pen: 0, sand: false, done: false }; });
  const par = holes.reduce((s, h) => s + h.par, 0), hi = playHI();
  return {
    id: "r" + Date.now().toString(36), courseId: c.id, courseName: c.name, tee: tee.name, cr: +tee.cr, slope: +tee.slope,
    date: f.date, start: f.start, count: f.count, par, hiAtStart: hi,
    ch: courseHandicap(hi, +tee.cr, +tee.slope, par, f.count), holes, cur: 0, finished: false
  };
}

/* ---------- Statistics ---------- */
function statRounds(){ const rs = finished(); return S.filterN === 0 ? rs : rs.slice(-S.filterN); }
const statCache = new WeakMap();
function computeStats(rs){
  if (rs.length === 1 && rs[0].finished) { if (!statCache.has(rs[0])) statCache.set(rs[0], computeStatsRaw(rs)); return statCache.get(rs[0]); }
  return computeStatsRaw(rs);
}
function computeStatsRaw(rs){
  const H = rs.flatMap(r => r.holes.filter(h => h.done).map(h => ({ ...h, round: r })));
  if (!H.length) return null;
  const per18 = x => x / H.length * 18;
  const byPar = p => { const hs = H.filter(h => h.par === p); return hs.length ? { avg: hs.reduce((s, h) => s + h.strokes, 0) / hs.length, over: hs.reduce((s, h) => s + h.strokes - h.par, 0) / hs.length, n: hs.length } : null; };
  const fwH = H.filter(h => h.par >= 4 && h.fw), hit = fwH.filter(h => h.fw === "hit");
  const left = fwH.filter(h => h.fw === "left").length, right = fwH.filter(h => h.fw === "right").length;
  const pH = H.filter(h => h.putts != null);
  const gir = pH.filter(h => h.strokes - h.putts <= h.par - 2);
  const missG = pH.filter(h => h.strokes - h.putts > h.par - 2), scr = missG.filter(h => h.strokes <= h.par);
  const sandH = H.filter(h => h.sand), sandSave = sandH.filter(h => h.strokes <= h.par);
  const dist = { eagle: 0, birdie: 0, par: 0, bogey: 0, double: 0, triple: 0 };
  H.forEach(h => { const d = h.strokes - h.par; dist[d <= -2 ? "eagle" : d === -1 ? "birdie" : d === 0 ? "par" : d === 1 ? "bogey" : d === 2 ? "double" : "triple"]++; });
  const bigLoss = H.reduce((s, h) => s + Math.max(0, h.strokes - h.par - 1), 0);
  const front = H.filter(h => h.n <= 9), back = H.filter(h => h.n > 9);
  const avgOver = hs => hs.length ? hs.reduce((s, h) => s + h.strokes - h.par, 0) / hs.length : null;
  return {
    holes: H.length, rounds: rs.length,
    overPer18: per18(H.reduce((s, h) => s + h.strokes - h.par, 0)),
    p3: byPar(3), p4: byPar(4), p5: byPar(5),
    fir: fwH.length ? hit.length / fwH.length : null, fwN: fwH.length, left, right,
    gir: pH.length ? gir.length / pH.length : null,
    putts18: pH.length ? per18(pH.reduce((s, h) => s + h.putts, 0)) * H.length / pH.length : null,
    three18: pH.length ? pH.filter(h => h.putts >= 3).length / pH.length * 18 : null,
    one: pH.length ? pH.filter(h => h.putts <= 1).length / pH.length : null,
    pen18: per18(H.reduce((s, h) => s + (h.pen || 0), 0)),
    scramble: missG.length ? scr.length / missG.length : null,
    sand: sandH.length ? sandSave.length / sandH.length : null, sandN: sandH.length,
    dist, bigLoss18: per18(bigLoss),
    front: avgOver(front), back: avgOver(back)
  };
}
/* approximate references for a player of a given handicap (amateur averages) */
function refs(hi){
  const h = Math.max(0, Math.min(36, hi ?? 20));
  return {
    fir: Math.max(.3, .6 - .0075 * h), gir: Math.max(.05, .67 - .024 * h), putts: 30 + .2 * h,
    three: 1 + .1 * h, pen: .3 + .085 * h, scramble: Math.max(.1, .6 - .017 * h),
    p3: 3 + .055 * h * 18 / 18 * 1.05, p4: 4 + .055 * h, p5: 5 + .05 * h
  };
}
function insights(st, hi){
  if (!st) return [];
  const R = refs(hi), out = [];
  const add = (loss, title, text) => out.push({ loss, title, text });
  if (st.putts18 != null) {
    const l = st.putts18 - R.putts;
    add(l, `Putt: ${fmt1(st.putts18)} putts por vuelta`, `Un jugador de tu nivel ronda los ${fmt1(R.putts)}. Haces ${fmt1(st.three18)} tres-putts por vuelta (referencia ${fmt1(R.three)}).${st.three18 > R.three ? " Trabaja el putt largo: control de distancia a 8–15 m." : ""}`);
  }
  if (st.pen18 != null) add((st.pen18 - R.pen) * 1.3, `Penalizaciones: ${fmt1(st.pen18)} golpes por vuelta`, st.pen18 > R.pen ? `Cada bola perdida o al agua cuesta golpe y distancia. Con un palo más conservador desde el tee en los hoyos con peligro ahorrarías cerca de ${fmt1(st.pen18 - R.pen)} golpes.` : "Mantienes la bola en juego. Bien.");
  if (st.fir != null && st.fwN >= 6) {
    const side = st.left + st.right ? (st.right > st.left ? `a la derecha (${Math.round(st.right / (st.left + st.right) * 100)}% de los fallos)` : `a la izquierda (${Math.round(st.left / (st.left + st.right) * 100)}% de los fallos)`) : "";
    add((R.fir - st.fir) * 8, `Calles cogidas: ${pct(st.fir)}`, `Referencia para tu hándicap: ${pct(R.fir)}.${side ? " Fallas sobre todo " + side + "." : ""}`);
  }
  if (st.gir != null) add((R.gir - st.gir) * 12, `Greens en regulación: ${pct(st.gir)}`, `Referencia: ${pct(R.gir)}. Si fallas greens, revisa la elección de palo: la mayoría de amateurs se quedan cortos.`);
  if (st.scramble != null) add((R.scramble - st.scramble) * 8, `Scrambling: ${pct(st.scramble)}`, `Salvas el par cuando fallas green el ${pct(st.scramble)} de las veces (referencia ${pct(R.scramble)}). El juego corto alrededor del green decide aquí.`);
  [["p3", 3, "pares 3"], ["p4", 4, "pares 4"], ["p5", 5, "pares 5"]].forEach(([k, p, name]) => {
    const v = st[k]; if (!v) return;
    const ref = p === 3 ? 3 + .05 * Math.max(0, hi ?? 20) : R[k];
    const holesPer18 = p === 4 ? 10 : 4;
    add((v.avg - ref) * holesPer18, `En ${name}: ${fmt1(v.avg)} de media`, `Referencia ${fmt1(ref)}. Sobre ${holesPer18} hoyos así por vuelta, son ${fmt1((v.avg - ref) * holesPer18)} golpes de diferencia.`);
  });
  add(st.bigLoss18 - 2.5, `Hoyos desastre: ${fmt1(st.bigLoss18)} golpes por vuelta más allá del bogey`, "Dobles y triples suman rápido. Cuando estés en problemas, saca la bola a calle y acepta el bogey.");
  return out.sort((a, b) => b.loss - a.loss);
}
function perHole(courseId, rs){
  const m = {};
  rs.filter(r => r.courseId === courseId).forEach(r => r.holes.filter(h => h.done).forEach(h => {
    const x = m[h.n] || (m[h.n] = { n: h.n, par: h.par, sum: 0, cnt: 0 });
    x.sum += h.strokes - h.par; x.cnt++;
  }));
  return m;
}

/* ---------- Geo: distances, OpenStreetMap import, club choice ---------- */
const GPS = { on: false, pos: null, acc: null, watch: null, err: null, shotStart: null, shotClub: null };
function dist(a, b){
  const R = 6371000, t = Math.PI / 180, dLa = (b[0] - a[0]) * t, dLo = (b[1] - a[1]) * t;
  const x = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * t) * Math.cos(b[0] * t) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function centroid(poly){ const n = poly.length; return [poly.reduce((s, p) => s + p[0], 0) / n, poly.reduce((s, p) => s + p[1], 0) / n]; }
/* front, centre and back of the green as seen from the player */
function greenDistances(me, g){
  if (!g?.green) return null;
  const c = dist(me, g.green);
  if (!g.poly || g.poly.length < 3) return { c, f: null, b: null };
  const k = Math.cos(me[0] * Math.PI / 180), xy = p => [(p[1] - me[1]) * 111320 * k, (p[0] - me[0]) * 110540];
  const P = g.poly.map(xy);
  let f = Infinity, b = 0, inside = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
    const [x1, y1] = P[j], [x2, y2] = P[i], dx = x2 - x1, dy = y2 - y1;
    const t = Math.max(0, Math.min(1, -(x1 * dx + y1 * dy) / (dx * dx + dy * dy || 1)));
    f = Math.min(f, Math.hypot(x1 + t * dx, y1 + t * dy));
    b = Math.max(b, Math.hypot(x2, y2));
    if ((y1 > 0) !== (y2 > 0) && 0 < (x2 - x1) * (0 - y1) / (y2 - y1) + x1) inside = !inside;
  }
  return { c, f: inside ? 0 : f, b };
}
function holeGeo(courseId, n){ return courses()[courseId]?.geo?.holes?.[n] || null; }
function holeLength(g){ if (!g?.path || g.path.length < 2) return g?.tee && g?.green ? dist(g.tee, g.green) : null; let L = 0; for (let i = 1; i < g.path.length; i++) L += dist(g.path[i - 1], g.path[i]); return L; }
function saveGeo(courseId, n, patch){
  const c = S.courses[courseId] || JSON.parse(JSON.stringify(courses()[courseId] || S.editCourse));
  c.geo = c.geo || { holes: {} }; c.geo.holes = c.geo.holes || {};
  c.geo.holes[n] = { ...(c.geo.holes[n] || {}), ...patch };
  S.courses[courseId] = c; Store.course(courseId);
  if (S.editCourse?.id === courseId) S.editCourse.geo = JSON.parse(JSON.stringify(c.geo));
}
const OVERPASS = "https://overpass-api.de/api/interpreter";
async function overpass(q){
  const res = await fetch(OVERPASS, { method: "POST", body: "data=" + encodeURIComponent(q), headers: { "Content-Type": "application/x-www-form-urlencoded" } });
  if (!res.ok) throw new Error(res.status === 429 ? "OpenStreetMap está saturado. Prueba en un minuto." : "OpenStreetMap no responde (" + res.status + ").");
  return res.json();
}
async function osmImport(query){
  const name = query.replace(/["\\]/g, "").trim();
  const j1 = await overpass(`[out:json][timeout:25];nwr["leisure"="golf_course"]["name"~"${name}",i];out center tags;`);
  const els = j1.elements.filter(e => e.center || e.lat);
  if (!els.length) throw new Error(`No hay ningún campo llamado "${name}" en OpenStreetMap.`);
  const el = els.find(e => !/pitch|putt/i.test(e.tags?.name || "")) || els[0];
  const center = el.center ? [el.center.lat, el.center.lon] : [el.lat, el.lon];

function gpsStart(){

  if (GPS.watch != null) return;

  GPS.watch = navigator.geolocation.watchPosition(p => {
    GPS.pos = [p.coords.latitude, p.coords.longitude]; GPS.acc = p.coords.accuracy; GPS.err = null;
    updateGps(); MapUI.drawMe();
  }, e => {
    GPS.err = e.code === 1 ? "Permiso de ubicación denegado. Actívalo en los ajustes del navegador para esta web." : "Sin señal GPS todavía. Sal a cielo abierto.";
    if (e.code === 1) { navigator.geolocation.clearWatch(GPS.watch); GPS.watch = null; GPS.on = false; }
    updateGps();

function gpsHtml(){
  const r = S.active; if (!r) return "";
  const h = r.holes[r.cur], g = holeGeo(r.courseId, h.n), L = holeLength(g);
  const head = `<div class="row between"><span class="eyebrow">Distancia al green · hoyo ${h.n}${L ? ` · ${Math.round(L)} m` : ""}</span>${GPS.acc ? `<span class="eyebrow">GPS ±${Math.round(GPS.acc)} m</span>` : ""}</div>`;
  const mapBtn = `<button class="btn" data-a="openmap">Ver hoyo en el mapa</button>`;
  if (!GPS.on) return `<div class="card gps stack">${head}${GPS.err ? `<p style="margin:0">${esc(GPS.err)}</p>` : `<p style="margin:0;opacity:.9">Activa el GPS para ver a cuántos metros estás del green.</p>`}<div class="row"><button class="btn primary" data-a="gps">Activar GPS</button>${mapBtn}</div></div>`;
  if (!GPS.pos) return `<div class="card gps stack">${head}<p style="margin:0">${esc(GPS.err || "Buscando señal GPS…")}</p><div class="row">${mapBtn}</div></div>`;
  const shot = GPS.shotStart ? dist(GPS.shotStart, GPS.pos) : null;
  const shotUI = GPS.shotStart ? `<div class="row between"><span>Distancia del golpe: <b class="num" style="font-size:20px">${Math.round(shot)} m</b></span><button class="btn" data-a="shotcancel">Terminar</button></div>`
    : `<button class="btn" data-a="shotstart">Medir golpe desde aquí</button>`;
  if (!g?.green) return `<div class="card gps stack">${head}<p style="margin:0">Este hoyo aún no tiene el green situado. Márcalo en el mapa tocando la imagen de satélite, o pulsa aquí cuando estés sobre el green.</p><div class="row">${mapBtn}<button class="btn" data-a="markgreenhere">Estoy en el green</button></div>${shotUI}</div>`;
  const d = greenDistances(GPS.pos, g);
  return `<div class="card gps stack">${head}
    <div class="dist"><div><span class="eyebrow">Delante</span><b>${d.f == null ? "–" : Math.round(d.f)}</b></div><div class="c"><span class="eyebrow">Centro</span><b>${Math.round(d.c)}</b></div><div><span class="eyebrow">Fondo</span><b>${d.b == null ? "–" : Math.round(d.b)}</b></div></div>
    ${d.c <= 25 ? `<div class="club"><b>En el green o muy cerca</b></div>` : ""}
    <div class="row">${mapBtn}</div>${shotUI}</div>`;
}
function updateGps(){ const el = document.getElementById("gps"); if (el) el.innerHTML = gpsHtml(); }

let leafletP = null;
function loadLeaflet(){
  return leafletP || (leafletP = new Promise((ok, ko) => {
    const css = document.createElement("link"); css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(css);
    const js = document.createElement("script"); js.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    js.onload = ok; js.onerror = () => { leafletP = null; ko(); }; document.head.appendChild(js);
  }));
}
const MapUI = {
  map: null, layer: null, me: null, mode: "measure", courseId: null, n: 1, list: [], point: null,
  open(courseId, n, list){
    if (!window.L) { showToast("Cargando mapa…"); loadLeaflet().then(() => this.open(courseId, n, list)).catch(() => showToast("El mapa necesita conexión la primera vez que se abre.")); return; }
    this.courseId = courseId; this.n = n; this.list = list || Array.from({ length: 18 }, (_, i) => i + 1); this.point = null; this.mode = "measure";
    $("#mapwrap").hidden = false;
    if (!this.map) {
      this.map = L.map("map", { zoomControl: false, maxZoom: 21 });
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 19, maxZoom: 21, attribution: "Imágenes © Esri" }).addTo(this.map);
      this.layer = L.layerGroup().addTo(this.map);
      this.map.on("click", e => this.tap([e.latlng.lat, e.latlng.lng]));
      $("#m-close").onclick = () => { $("#mapwrap").hidden = true; render(); };
      $("#m-prev").onclick = () => this.step(-1); $("#m-next").onclick = () => this.step(1);
      $("#m-me").onclick = () => { if (GPS.pos) this.map.setView(GPS.pos, 18); else { gpsStart(); showToast("Buscando tu posición…"); } };
      $("#m-mode").onclick = e => { const b = e.target.closest("[data-m]"); if (!b) return; this.mode = b.dataset.m; this.point = null; this.draw(); };
    }
    setTimeout(() => { this.map.invalidateSize(); this.draw(true); }, 30);
  },
  step(d){ const i = this.list.indexOf(this.n); this.n = this.list[(i + d + this.list.length) % this.list.length]; this.point = null; this.draw(true); },
  async frame(){
    const g = holeGeo(this.courseId, this.n), c = courses()[this.courseId];
    if (g?.tee && g?.green) return this.map.fitBounds(L.latLngBounds([g.tee, g.green, ...(g.path || [])]), { padding: [40, 40], maxZoom: 19 });
    if (g?.green) return this.map.setView(g.green, 18);
    if (GPS.pos) return this.map.setView(GPS.pos, 18);
    if (c?.geo?.center) return this.map.setView(c.geo.center, 16);
    this.map.setView([40.4, -3.7], 6);
    try {
      const r = await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" + encodeURIComponent(c.name));
      const j = await r.json();
      if (j[0]) { const center = [+j[0].lat, +j[0].lon]; this.map.setView(center, 16); const cc = S.courses[this.courseId] || JSON.parse(JSON.stringify(c)); cc.geo = { ...(cc.geo || { holes: {} }), center }; S.courses[this.courseId] = cc; Store.course(this.courseId); }
    } catch {}
  },
  draw(reframe){
    const g = holeGeo(this.courseId, this.n) || {};
    $("#m-title").textContent = `Hoyo ${this.n}` + (holeLength(g) ? ` · ${Math.round(holeLength(g))} m` : "");
    [...$("#m-mode").children].forEach(b => b.setAttribute("aria-pressed", b.dataset.m === this.mode));
    this.layer.clearLayers(); this.me = null;
    if (g.path) L.polyline(g.path, { color: "#fff", weight: 2, dashArray: "4 6", opacity: .8 }).addTo(this.layer);
    if (g.poly) L.polygon(g.poly, { color: "#E8B53A", weight: 2, fillOpacity: .15 }).addTo(this.layer);
    const dot = (p, col) => L.marker(p, { icon: L.divIcon({ className: "", html: `<div class="pin" style="background:${col}"></div>`, iconSize: [18, 18], iconAnchor: [9, 9] }) }).addTo(this.layer);
    if (g.tee) dot(g.tee, "#2F7A52");
    if (g.green) dot(g.green, "#D9A21B");
    if (this.point) {
      dot(this.point, "#ffffff");
      const from = GPS.pos || g.tee;
      if (from) L.polyline([from, this.point], { color: "#fff", weight: 2 }).addTo(this.layer);
      if (g.green) L.polyline([this.point, g.green], { color: "#E8B53A", weight: 2 }).addTo(this.layer);
    }
    this.drawMe();
    if (reframe) this.frame();
    this.info();
  },
  drawMe(){
    if (!this.map || $("#mapwrap").hidden || !GPS.pos) return;
    if (this.me) this.me.setLatLng(GPS.pos); else this.me = L.circleMarker(GPS.pos, { radius: 8, color: "#fff", weight: 3, fillColor: "#3B82F6", fillOpacity: 1 }).addTo(this.layer);

  },
  info(){
    const g = holeGeo(this.courseId, this.n) || {}, out = [];

      if (this.point && from) out.push(`<div><span class="eyebrow">${fromName} → punto</span><b>${Math.round(dist(from, this.point))} m</b></div>`);
      if (this.point && g.green) out.push(`<div><span class="eyebrow">Punto → green</span><b>${Math.round(dist(this.point, g.green))} m</b></div>`);
      if (!out.length) out.push(`<span class="muted">${g.green ? "Toca el mapa para medir hasta cualquier punto: un bunker, el agua, el punto donde quieres dejar la bola." : "Este hoyo no tiene green marcado. Elige «Marcar green» y toca la imagen."}</span>`);
    }
    $("#m-info").innerHTML = out.join("");
  },
  tap(p){
    if (this.mode === "green") { saveGeo(this.courseId, this.n, { green: p, poly: null }); this.mode = "measure"; showToast(`Green del hoyo ${this.n} guardado`); }

    else this.point = p;
    this.draw();
  }
};

function trendChart(){
  const hist = hiHistory().slice(-30);
  if (hist.length < 2) return `<p class="muted" style="margin:0">El gráfico aparece a partir de 2 vueltas con diferencial.</p>`;
  const W = 600, Hh = 220, L = 34, Rm = 12, T = 12, B = 26;
  const vals = hist.flatMap(p => [p.diff, p.hi]).filter(v => v != null);
  let lo = Math.floor(Math.min(...vals) / 5) * 5, hi = Math.ceil(Math.max(...vals) / 5) * 5; if (hi === lo) hi = lo + 5;
  const x = i => L + (W - L - Rm) * (hist.length === 1 ? .5 : i / (hist.length - 1));
  const y = v => T + (Hh - T - B) * (1 - (v - lo) / (hi - lo));
  const ticks = []; for (let v = lo; v <= hi; v += (hi - lo > 20 ? 10 : 5)) ticks.push(v);
  const line = hist.map((p, i) => p.hi == null ? null : [x(i), y(p.hi)]).filter(Boolean);
  const path = line.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line.length ? path + ` L${line.at(-1)[0].toFixed(1)} ${Hh - B} L${line[0][0].toFixed(1)} ${Hh - B} Z` : "";
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Evolución de diferenciales y hándicap">
    ${ticks.map(v => `<line x1="${L}" x2="${W - Rm}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("")}
    ${area ? `<path d="${area}" fill="var(--green)" opacity=".12"/>` : ""}
    ${path ? `<path d="${path}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>` : ""}
    ${hist.map((p, i) => `<circle data-a="pt" data-v="${i}" cx="${x(i)}" cy="${y(p.diff)}" r="${S.pt === i ? 7 : 5}" fill="${S.pt === i ? "var(--flag)" : "var(--surface)"}" stroke="var(--flag)" stroke-width="2"><title>${fmtDate(p.r.date)}: diferencial ${fmt1(p.diff)}</title></circle>`).join("")}
    ${line.length ? `<circle cx="${line.at(-1)[0]}" cy="${line.at(-1)[1]}" r="5" fill="var(--green)"/>` : ""}
    <text x="${L}" y="${Hh - 6}">${fmtDate(hist[0].r.date)}</text><text x="${W - Rm}" y="${Hh - 6}" text-anchor="end">${fmtDate(hist.at(-1).r.date)}</text>
  </svg>
  <div class="row muted" style="font-size:12px;gap:16px"><span><span class="dot" style="background:var(--green)"></span>Hándicap</span><span><span class="dot" style="background:var(--surface);border:2px solid var(--flag);width:10px;height:10px"></span>Diferencial de cada vuelta</span></div>
  ${(() => { const p = hist[S.pt]; return p ? `<div class="chartsel">${fmtDate(p.r.date)} · ${esc(p.r.courseName)} · <b>${toParStr(roundTotals(p.r).toPar)}</b> (${roundTotals(p.r).gross} golpes) · diferencial ${fmt1(p.diff)} · hándicap ${fmtHI(p.hi)}</div>` : `<div class="muted" style="font-size:12.5px">Toca un punto para ver esa vuelta.</div>`; })()}`;
}

    delcourse: `<h2>${S.editCourse?.builtin ? "¿Restablecer el campo?" : "¿Borrar el campo?"}</h2><p class="muted">Las vueltas ya jugadas se conservan.</p><div class="grid2"><button class="btn" data-a="closesheet">Cancelar</button><button class="btn danger" data-a="delcourse">Confirmar</button></div>`
  }[k] || (k === "book" ? bookSheet() : "");
  return `<div class="sheet-bg" data-a="closesheet"><div class="sheet stack ${k === "book" ? "book" : ""}" data-stop="1">${body}</div></div>`;
}

/* ---------- Actions ---------- */
let wakeLock = null;
async function keepAwake(){ try { if (S.active && navigator.wakeLock && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener?.("release", () => wakeLock = null); } } catch {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
let activeTimer = null;
function saveActive(){ clearTimeout(activeTimer); activeTimer = setTimeout(() => Store.active(), 400); }

const A = {
  tab(v){ S.tab = v; S.viewRound = null; S.sheet = null; window.scrollTo(0, 0); },
  formv(v, el){ S.form[el.dataset.k] = +v; },
  start(){ S.active = newRound(); Store.active(); keepAwake(); window.scrollTo(0, 0); },
  goto(v){ S.active.cur = +v; saveActive(); },
  inc(v, el){
    const h = S.active.holes[S.active.cur], k = el.dataset.k;
    const lim = { strokes: [1, 15], putts: [0, 6], pen: [0, 6] }[k];
    h[k] = Math.max(lim[0], Math.min(lim[1], h[k] + +v));
    if (k === "putts" && h.putts >= h.strokes) h.strokes = Math.min(lim[1], h.putts + 1);
    if (k === "strokes" && h.putts >= h.strokes) h.putts = h.strokes - 1;
    saveActive();
  },
  fw(v){ const h = S.active.holes[S.active.cur]; h.fw = h.fw === v ? null : v; saveActive(); },
  sand(){ const h = S.active.holes[S.active.cur]; h.sand = !h.sand; saveActive(); },
  next(){ const r = S.active, h = r.holes[r.cur], d = h.strokes - h.par; h.done = true; r.cur++; S.anim = "l"; saveActive(); window.scrollTo(0, 0); if (d <= -1) setTimeout(() => celebrate(relName(d)), 60); },
  prev(){ S.active.cur--; S.anim = "r"; saveActive(); },
  setscore(v){ const h = S.active.holes[S.active.cur]; h.strokes = Math.max(1, h.par + +v); if (h.putts >= h.strokes) h.putts = h.strokes - 1; saveActive(); },
  setputts(v){ const h = S.active.holes[S.active.cur]; h.putts = +v; if (h.putts >= h.strokes) h.strokes = h.putts + 1; saveActive(); },
  focus(v){ S.focus = S.focus === v ? null : v; },
  bookmark(v){ const n = S.active.holes[S.active.cur].n; S.bookMark = S.bookMark || {}; S.bookMark[n] = S.bookMark[n] === +v ? null : +v; },
  book(v){ S.bookHole = +v; S.sheet = "book"; },
  bookgo(v){ S.bookHole = +v; document.querySelector(".sheet.book")?.scrollTo?.(0, 0); },
  pt(v){ S.pt = S.pt === +v ? null : +v; },
  openround2(v){ S.tab = "hist"; S.viewRound = v; window.scrollTo(0, 0); },
  finishask(){ S.sheet = "finish"; },
  finish(){
    const r = S.active; r.holes[r.cur].done = true;
    r.finished = true; r.diff = differential(r); r.ags = adjustedGross(r); delete r.cur;
    S.rounds[r.id] = r; Store.round(r.id);
    S.active = null; clearTimeout(activeTimer); Store.active();
    S.sheet = null; S.tab = "hist"; S.viewRound = r.id; S.ai = null; S.justFinished = r.id;
    const prevR = finished().filter(x => x.id !== r.id && x.count === r.count);
    setTimeout(() => { document.querySelectorAll("[data-countup]").forEach(countUp); if (prevR.length && prevR.every(x => roundTotals(x).toPar > roundTotals(r).toPar)) celebrate("Mejor vuelta"); }, 80);
    try { wakeLock?.release(); } catch {}
  },
  abandon(){ S.active = null; clearTimeout(activeTimer); Store.active(); S.sheet = null; },
  sheet(v){ S.sheet = v; },
  closesheet(){ S.sheet = null; },
  openround(v){ S.viewRound = v; window.scrollTo(0, 0); },
  closeround(){ S.viewRound = null; },
  delround(){ const id = S.viewRound; delete S.rounds[id]; Store.round(id); S.viewRound = null; S.sheet = null; showToast("Vuelta borrada"); },
  editround(v){
    if (S.active) return showToast("Termina o descarta la vuelta en curso antes de corregir otra.");
    const r = JSON.parse(JSON.stringify(S.rounds[v])); r.finished = false; r.cur = 0;
    delete S.rounds[v]; Store.round(v);
    S.active = r; Store.active(); S.tab = "play"; S.viewRound = null;
  },
  filter(v){ S.filterN = +v; S.ai = null; },
  newcourse(){ S.editCourse = { id: "c" + Date.now().toString(36), name: "Nuevo campo", tees: [{ name: "Amarillas", cr: 72, slope: 125 }], holes: Array.from({ length: 18 }, (_, i) => ({ n: i + 1, par: 4, si: i + 1 })) }; },
  editcourse(v){ S.editCourse = JSON.parse(JSON.stringify(courses()[v])); S.osm = null; },
  cancelcourse(){ S.editCourse = null; },
  addtee(){ S.editCourse.tees.push({ name: "Rojas", cr: 72, slope: 125 }); },
  deltee(_, el){ S.editCourse.tees.splice(+el.dataset.i, 1); },
  savecourse(){
    const c = S.editCourse;
    if (new Set(c.holes.map(h => +h.si)).size !== 18 || c.holes.some(h => +h.si < 1 || +h.si > 18)) return showToast("Revisa los hándicaps: del 1 al 18, sin repetir.");
    if (c.tees.some(t => !t.name || !(+t.cr > 20) || !(+t.slope >= 55 && +t.slope <= 155))) return showToast("Cada barra necesita nombre, course rating y slope (55–155).");
    c.holes = c.holes.map(h => ({ n: h.n, par: +h.par, si: +h.si })); c.tees = c.tees.map(t => ({ name: t.name.trim(), cr: +t.cr, slope: +t.slope }));
    delete c.verify;
    if (S.courses[c.id]?.geo) c.geo = S.courses[c.id].geo;
    S.courses[c.id] = c; Store.course(c.id); S.editCourse = null; showToast("Campo guardado");
  },
  delcourse(){ const id = S.editCourse.id; delete S.courses[id]; Store.course(id); S.editCourse = null; S.sheet = null; if (S.form.courseId === id) S.form.courseId = "vallromanes"; showToast("Hecho"); },
  savehi(){ const v = $("#official-hi").value.replace(",", "."); S.profile.officialHI = v === "" ? null : Math.max(-10, Math.min(54, +v)); Store.profile(); showToast("Hándicap guardado"); },
  async ai(){
    const st = computeStats(statRounds()), hi = playHI();
    const ins = insights(st, hi).map(i => `- ${i.title}: ${i.text}`).join("\n");
    const cid = statRounds().slice(-1)[0]?.courseId, ph = cid ? Object.values(perHole(cid, statRounds())).map(x => `h${x.n} par${x.par} ${x.sum / x.cnt >= 0 ? "+" : ""}${(x.sum / x.cnt).toFixed(2)}`).join(", ") : "";
    const txt = `Eres mi entrenador de golf. Mis datos (hándicap ${hi ?? "desconocido"}, ${st.rounds} vueltas, ${st.holes} hoyos):
${JSON.stringify({ sobreParPor18: r1(st.overPer18), putts18: st.putts18 && r1(st.putts18), tresPutts18: st.three18 && r1(st.three18), calles: st.fir, fallosIzq: st.left, fallosDer: st.right, gir: st.gir, scrambling: st.scramble, penalizaciones18: r1(st.pen18), salvarBunker: st.sand, mediaPar3: st.p3?.avg, mediaPar4: st.p4?.avg, mediaPar5: st.p5?.avg, reparto: st.dist })}
Diagnóstico de mi app:
${ins}
Hoyo a hoyo (${courses()[cid]?.name || ""}): ${ph}
Dame: 1) diagnóstico en dos frases, 2) las tres prioridades ordenadas por golpes que puedo ahorrar, cada una con un ejercicio concreto (repeticiones y objetivo medible), 3) estrategia para mis peores hoyos.`;
    try { await navigator.clipboard.writeText(txt); S.ai = "Copiado. Ábrelo en Claude (claude.ai o la app) y pégalo en un chat nuevo."; }
    catch { S.ai = esc(txt); }
  },
  gps(){ gpsStart(); try { localStorage.setItem("golf-gps", "1"); } catch {} },
  openmap(){ const r = S.active; MapUI.open(r.courseId, r.holes[r.cur].n, r.holes.map(h => h.n)); },
  coursemap(){ const c = S.editCourse; S.courses[c.id] || saveGeo(c.id, 1, {}); MapUI.open(c.id, 1); },
  markgreenhere(){ const r = S.active; if (!GPS.pos) return; saveGeo(r.courseId, r.holes[r.cur].n, { green: GPS.pos, poly: null }); showToast("Green guardado"); },
  shotstart(){ GPS.shotStart = GPS.pos; },
  shotcancel(){ GPS.shotStart = null; },
  async osm(){
    const c = S.editCourse, q = ($("#osm-q")?.value || c.name).trim();
    S.osm = { busy: true, msg: "Buscando en OpenStreetMap…" }; render();
    try {
      const res = await osmImport(q), nh = Object.keys(res.holes).length;
      if (!nh) { S.osm = { msg: `He encontrado "${res.osmName}" pero sus hoyos no están dibujados en OpenStreetMap. Marca los greens tocando el mapa de satélite.` }; return; }
      Object.entries(res.holes).forEach(([n, g]) => saveGeo(c.id, +n, g));
      const cc = S.courses[c.id]; cc.geo.center = res.center; Store.course(c.id); S.editCourse.geo = JSON.parse(JSON.stringify(cc.geo));
      const pn = Object.keys(res.parsi).length, siOk = pn === 18 && new Set(Object.values(res.parsi).map(x => x.si)).size === 18 && Object.values(res.parsi).every(x => x.si >= 1 && x.si <= 18);
      if (pn === 18) S.editCourse.holes.forEach(h => { h.par = res.parsi[h.n].par; if (siOk) h.si = res.parsi[h.n].si; });
      S.osm = { msg: `"${res.osmName}": ${nh} hoyos con recorrido y ${res.greens} greens guardados.${pn === 18 ? ` También he puesto el par${siOk ? " y el hándicap" : ""} de cada hoyo según OpenStreetMap: revísalos con tu tarjeta y pulsa Guardar.` : " Revisa el par y hándicap con tu tarjeta."}` };
    } catch (e) { S.osm = { msg: e.message || "No se pudo conectar con OpenStreetMap." }; }
  },
  resetshots(_, el){ delete S.profile.shots[el.dataset.v]; Store.profile(); },
  exportdata(){
    const blob = new Blob([JSON.stringify({ app: "tarjeta-golf", v: 1, profile: S.profile, courses: S.courses, rounds: S.rounds }, null, 1)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `golf-copia-${today()}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  },
  importdata(){ $("#importfile").click(); }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el || el.tagName === "SELECT" || el.tagName === "INPUT") return;
  if (el.classList.contains("sheet-bg") && e.target.closest("[data-stop]")) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (S.active && S.tab === "play") { try { navigator.vibrate?.(8); } catch {} }
  const p = fn(el.dataset.v, el);
  render();
  if (p?.then) p.then(render);
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches?.('g[role="button"][data-a]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});
let touch = null;
document.addEventListener("touchstart", e => {
  touch = S.tab === "play" && S.active && !S.sheet && !e.target.closest(".holebar,.clubchips,#mapwrap,.sheet-bg,input,select") ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
}, { passive: true });
document.addEventListener("touchend", e => {
  if (!touch || !S.active) return;
  const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y; touch = null;
  if (Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * .6) return;
  const r = S.active;
  if (dx < 0 && r.cur < r.holes.length - 1) { A.next(); render(); window.scrollTo(0, 0); }
  else if (dx > 0 && r.cur > 0) { A.prev(); render(); }
}, { passive: true });
document.addEventListener("change", e => {
  const el = e.target, a = el.dataset.a;
  if (a === "form") { S.form[el.dataset.k] = el.value; if (el.dataset.k === "courseId") S.form.tee = courses()[el.value].tees.find(t => t.name === S.form.tee)?.name || courses()[el.value].tees[0].name; render(); }
  else if (a === "statcourse") { S.statCourse = el.value; render(); }
  else if (a === "hole") { S.editCourse.holes[+el.dataset.i][el.dataset.k] = +el.value; render(); }
});
document.addEventListener("input", e => {
  const el = e.target, a = el.dataset.a;
  if (a === "cfield") S.editCourse[el.dataset.k] = el.value;
  else if (a === "tee") S.editCourse.tees[+el.dataset.i][el.dataset.k] = el.value;
});

document.addEventListener("change", async e => {
  if (e.target.id !== "importfile" || !e.target.files[0]) return;
  try {
    const j = JSON.parse(await e.target.files[0].text());
    if (j.app !== "tarjeta-golf") throw 0;
    Object.assign(S.rounds, j.rounds || {}); Object.assign(S.courses, j.courses || {}); Object.assign(S.profile, j.profile || {});
    Store.saveLocal(); showToast(`Copia importada: ${Object.keys(j.rounds || {}).length} vueltas`);
  } catch { showToast("Ese archivo no es una copia de esta app."); }
  e.target.value = "";
});
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
renderTabs();
Store.init().then(() => {
  S.ready = true;
  const last = finished().slice(-1)[0];
  if (last && courses()[last.courseId]) { S.form.courseId = last.courseId; S.form.tee = last.tee; }
  if (S.active) keepAwake();
  try { if (localStorage.getItem("golf-gps") === "1") gpsStart(); } catch {}
  render();
});
</script>
